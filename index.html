      "<span class=\"summary-item\">最新：<strong>" + fmtDate(pair.now.date) + "</strong></span>" +
      "<span class=\"summary-item\">结论条数：<strong>" + pair.now.conclusions.length + "</strong></span>" +
      "<span class=\"summary-item\">行动事项：<strong>" + pair.now.actions.length + "</strong></span>";
    container.appendChild(summary);

    var grid = document.createElement("div");
    grid.className = "compare-grid";
    grid.appendChild(renderPanel(pair.old, false));
    grid.appendChild(renderPanel(pair.now, true));
    container.appendChild(grid);

    container.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  pairs.forEach(function (p, idx) {
    var btn = document.createElement("button");
    btn.className = "date-nav-btn";
    btn.textContent = fmtDate(p.old.date) + " → " + fmtDate(p.now.date);
    if (idx === currentPairIdx) btn.classList.add("active");
    btn.addEventListener("click", function () { currentPairIdx = idx; render(); });
    dateNavBar.appendChild(btn);
  });

  render();
})();
</script>
</body>
</html>
