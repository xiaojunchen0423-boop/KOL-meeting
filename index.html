  .stats-bar .stat { font-size: 13px; color: var(--gray-700); }
  .stats-bar .stat strong { color: var(--primary); font-size: 18px; }

  .date-nav-bar {

  .date-nav-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }

    background: #fff; border-radius: 12px; padding: 28px;

  .nav-tab {

  .nav-tab:hover { border-color: var(--primary); color: var(--primary); }
  .nav-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .compare-panel { border: 1px solid var(--gray-200); border-radius: 10px; overflow: hidden; }
  .panel-header {
    padding: 14px 18px; font-weight: 700; font-size: 15px;
    display: flex; align-items: center; gap: 10px;

  .panel-header .badge { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 10px; }
  .panel-old .panel-header { background: #FEF3C7; color: #92400E; }
  .panel-old .badge { background: #FDE68A; color: #78350F; }
  .panel-new .panel-header { background: #D1FAE5; color: #065F46; }
  .panel-new .badge { background: #A7F3D0; color: #064E3B; }

  .section-block li { margin-bottom: 4px; }
  .section-block table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  .section-block th, .section-block td { border: 1px solid var(--gray-200); padding: 8px 10px; text-align: left; vertical-align: top; }
  .section-block th { background: var(--gray-50); font-weight: 600; }

  .diff-new { background: #DCFCE7; padding: 1px 4px; border-radius: 3px; }
  .diff-removed { background: #FEE2E2; padding: 1px 4px; border-radius: 3px; text-decoration: line-through; }
  .diff-changed { background: #FEF3C7; padding: 1px 4px; border-radius: 3px; }

  .summary-bar { display: flex; gap: 20px; padding: 14px 18px; background: var(--gray-50); border-radius: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .summary-item { font-size: 13px; color: var(--gray-700); }

  .diff-section { margin-top:20px; border-top:2px solid var(--gray-200); padding-top:20px; }

    .container { padding: 12px 8px; }
    .comparison-section { padding: 16px; }

</style>

function renderStats() {
  document.getElementById('statMeetings').textContent = meetings.length;
  document.getElementById('statPairs').textContent = meetings.length - 1;
  const first = meetings[0].date.toLocaleDateString('zh-CN', {month:'2-digit', day:'2-digit'});
  const last = meetings[meetings.length-1].date.toLocaleDateString('zh-CN', {month:'2-digit', day:'2-digit'});
  document.getElementById('statSpan').textContent = `${first} ~ ${last}`;
}

function renderDateNav() {
  const bar = document.getElementById('dateNavBar');
  let html = '<span class="label">📅 已收录 ' + meetings.length + ' 场会议 · 时间跨度：';
  const first = meetings[0].date.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
  const last = meetings[meetings.length-1].date.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
  html += first + ' – ' + last + '</span>';
  bar.innerHTML = html;
}

function renderAllComparisons() {
  const pairs = [];
  for (let i = meetings.length - 1; i >= 1; i--) {
    pairs.push({ old: meetings[i - 1], new_: meetings[i], index: pairs.length });
  }
  pairs.reverse();

  const navTabs = document.getElementById('navTabs');
  navTabs.innerHTML = pairs.map((p, i) => {
    const oldD = p.old.date.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
    const newD = p.new_.date.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
    const isLatest = (i === 0);
    return `<button class="nav-tab ${isLatest ? 'active' : ''}" data-index="${i}" onclick="switchTab(${i})">${oldD} → ${newD}${isLatest ? '（最新）' : ''}</button>`;
  }).join('');

  const content = document.getElementById('comparisonContent');
  content.innerHTML = pairs.map((p, i) => {
    return `<div class="compare-pair" id="pair-${i}" style="${i === 0 ? '' : 'display:none;'}">
      ${renderPairComparison(p.old, p.new_)}
    </div>`;
  }).join('');
}

function renderPairComparison(oldM, newM) {
  const oldDate = oldM.date.toLocaleDateString('zh-CN');
  const newDate = newM.date.toLocaleDateString('zh-CN');

  const oldC = oldM.conclusions.length;
  const newC = newM.conclusions.length;
  const oldA = oldM.actions.length;
  const newA = newM.actions.length;

  let html = `
    <div class="summary-bar">
      <div class="summary-item"><strong>${oldDate}</strong>：结论 ${oldC} 条 / 行动 ${oldA} 项</div>
      <div class="summary-item"><strong>${newDate}</strong>：结论 ${newC} 条 / 行动 ${newA} 项</div>
      <div class="summary-item">结论变化：<strong>${newC > oldC ? '+' : ''}${newC - oldC}</strong></div>
      <div class="summary-item">行动事项变化：<strong>${newA > oldA ? '+' : ''}${newA - oldA}</strong></div>
    </div>
    <div class="compare-grid">
      ${renderPanel(oldM, 'old', oldDate)}
      ${renderPanel(newM, 'new', newDate)}
    </div>
    ${renderDiff(oldM, newM)}
  `;
  return html;
}

  // Topics
  body += `<div class="section-block"><h4>📋 讨论议题</h4><ul>`;
  body += meeting.topics.map(t => `<li>${escapeHtml(t)}</li>`).join('');
  body += `</ul></div>`;

  // Actions table
  body += `<div class="section-block"><h4>✅ 行动事项 (${meeting.actions.length}项)</h4>`;
  body += `<table><thead><tr><th>任务</th><th>负责人</th><th>时间</th><th>优先级</th></tr></thead><tbody>`;
  body += meeting.actions.map(a =>
    `<tr><td>${escapeHtml(a.task)}</td><td>${escapeHtml(a.who)}</td><td>${escapeHtml(a.when)}</td><td>${priBadge(a.pri)}</td></tr>`
  ).join('');
  body += `</tbody></table></div>`;

  // Full text toggle
  body += `<div class="full-content-toggle">
    <button onclick="toggleFullContent(this)">📄 显示/隐藏完整会议内容</button>
    <div class="full-content">${escapeHtml(meeting.fullText)}</div>
  </div>`;

  return `<div class="compare-panel ${cls}">
    <div class="panel-header">
      <span class="badge">${type === 'old' ? '📖 前次' : '🆕 最新'}</span>
      ${dateStr}
    </div>
    <div class="panel-body">${body}</div>
  </div>`;
}

function renderDiff(oldM, newM) {
  const oldSet = new Set(oldM.conclusions);
  const newSet = new Set(newM.conclusions);
  const added = newM.conclusions.filter(c => !oldSet.has(c));
  const removed = oldM.conclusions.filter(c => !newSet.has(c));

  const oldATitles = new Set(oldM.actions.map(a => a.task));
  const newATitles = new Set(newM.actions.map(a => a.task));
  const addedActions = newM.actions.filter(a => !oldATitles.has(a.task));
  const removedActions = oldM.actions.filter(a => !newATitles.has(a.task));

  const oldT = new Set(oldM.topics);
  const newT = new Set(newM.topics);
  const addedTopics = newM.topics.filter(t => !oldT.has(t));
  const removedTopics = oldM.topics.filter(t => !newT.has(t));

  let html = `<div class="diff-section"><h3>🔄 变化对比分析</h3>`;

  if (added.length > 0) {
    html += `<div class="section-block"><h4 style="color:#16A34A;">➕ 新增结论 (${added.length}条)</h4><ul>`;
    html += added.map(c => `<li><span class="diff-new">${escapeHtml(c)}</span></li>`).join('');
    html += `</ul></div>`;
  }
  if (removed.length > 0) {
    html += `<div class="section-block"><h4 style="color:#DC2626;">➖ 不再提及的结论 (${removed.length}条)</h4><ul>`;
    html += removed.map(c => `<li><span class="diff-removed">${escapeHtml(c)}</span></li>`).join('');
    html += `</ul></div>`;
  }
  if (addedActions.length > 0) {
    html += `<div class="section-block"><h4 style="color:#16A34A;">➕ 新增行动事项 (${addedActions.length}项)</h4><ul>`;
    html += addedActions.map(a => `<li><span class="diff-new">${escapeHtml(a.task)}</span> <span style="color:#6B7280;font-size:12px;">(${escapeHtml(a.who)})</span></li>`).join('');
    html += `</ul></div>`;
  }
  if (removedActions.length > 0) {
    html += `<div class="section-block"><h4 style="color:#DC2626;">➖ 已完成的/不再提及的行动事项 (${removedActions.length}项)</h4><ul>`;
    html += removedActions.map(a => `<li><span class="diff-removed">${escapeHtml(a.task)}</span></li>`).join('');
    html += `</ul></div>`;
  }
  if (addedTopics.length > 0 || removedTopics.length > 0) {
    html += `<div class="section-block"><h4>📊 议题变化</h4>`;
    if (addedTopics.length > 0) html += `<p style="color:#16A34A;font-size:13px;">新增议题：<span class="diff-new">${addedTopics.map(escapeHtml).join('、')}</span></p>`;
    if (removedTopics.length > 0) html += `<p style="color:#DC2626;font-size:13px;">不再讨论：<span class="diff-removed">${removedTopics.map(escapeHtml).join('、')}</span></p>`;
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

// ============ Tab switching ============
function switchTab(index) {
  document.querySelectorAll('.nav-tab').forEach((t, i) => {
    t.classList.toggle('active', i === index);
  });
  document.querySelectorAll('.compare-pair').forEach((p, i) => {
    p.style.display = i === index ? '' : 'none';
  });
}

function toggleFullContent(btn) {
  const box = btn.nextElementSibling;
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

// ============ Helpers ============
function priBadge(pri) {
  if (!pri) return '-';
  const p = pri.toLowerCase();
  if (p === '高' || p === '高优先级') return '<span style="color:#DC2626;font-weight:700;">🔴 高</span>';
  if (p === '中' || p === '中优先级') return '<span style="color:#D97706;font-weight:700;">🟡 中</span>';
  if (p === '低' || p === '低优先级') return '<span style="color:#6B7280;font-weight:700;">⚪ 低</span>';
  return escapeHtml(pri);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ============ Init ============
init();
</script>
</body>
</html>
